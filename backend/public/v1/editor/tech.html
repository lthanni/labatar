<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Labatar Tech editor</title>
    <link rel="stylesheet" href="/v1/editor/app.css" />
    <script type="module" src="/v1/editor/tech.js"></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Labatar catalog</p>
          <h1>Tech editor</h1>
          <p>Publish short tools under character or support subsections.</p>
        </div>
        <a href="/v1/tech" target="_blank" rel="noopener noreferrer">Public Tech ↗</a>
      </header>

      <section class="panel" aria-labelledby="section-heading">
        <h2 id="section-heading">Subsections</h2>
        <div class="row">
          <select id="existing-section" aria-label="Existing subsection">
            <option value="">New subsection</option>
          </select>
          <button id="new-section" type="button">New subsection</button>
        </div>
        <p id="section-revision" class="muted">New subsection</p>
        <div class="grid two">
          <label
            >Subsection ID
            <input id="section-id" required maxlength="100" placeholder="aang-air-movement"
          /></label>
          <label
            >Title <input id="section-title" required maxlength="100" placeholder="Air movement"
          /></label>
        </div>
        <div class="grid two">
          <label
            >For
            <select id="scope-kind">
              <option value="character">Character</option>
              <option value="support">Support</option>
            </select></label
          >
          <label
            >Character or support ID
            <input id="subject-id" required maxlength="100" placeholder="aang"
          /></label>
        </div>
        <label
          >Short description <textarea id="section-description" maxlength="500" rows="2"></textarea>
        </label>
        <label
          >Display order
          <input id="section-order" type="number" min="0" max="10000" step="1" value="0"
        /></label>
        <div class="row">
          <button id="save-section" class="primary" type="button">Publish subsection</button>
          <button id="unpublish-section" class="danger" type="button" hidden>
            Unpublish subsection
          </button>
        </div>
      </section>

      <section class="panel" aria-labelledby="entry-heading">
        <h2 id="entry-heading">Short tech entries</h2>
        <div class="row">
          <select id="existing-entry" aria-label="Existing tech">
            <option value="">New tech entry</option>
          </select>
          <button id="new-entry" type="button">New tech entry</button>
        </div>
        <p id="entry-revision" class="muted">New tech entry</p>
        <div class="grid two">
          <label
            >Tech ID <input id="entry-id" required maxlength="100" placeholder="aang-air-stall"
          /></label>
          <label
            >Title <input id="entry-title" required maxlength="160" placeholder="Air stall"
          /></label>
        </div>
        <label
          >Subsection
          <select id="entry-section" required></select
        ></label>
        <label
          >Short description <textarea id="entry-description" maxlength="1200" rows="3"></textarea>
        </label>
        <label
          >Display order
          <input id="entry-order" type="number" min="0" max="10000" step="1" value="0"
        /></label>
        <h2>YouTube videos</h2>
        <p class="muted">
          Each video has its own heading and description. Up to 12 videos per entry.
        </p>
        <div id="videos"></div>
        <button id="add-video" type="button">Add video</button>
        <div class="row" style="margin-top: 16px">
          <button id="save-entry" class="primary" type="button">Publish tech</button>
          <button id="unpublish-entry" class="danger" type="button" hidden>Unpublish tech</button>
        </div>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
