name = "labatar-catalog-local"
main = "src/local-worker.mjs"
compatibility_date = "2026-10-13"
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "labatar-catalog-local"
database_id = "00000000-0000-0000-0000-000000000001"

[[r2_buckets]]
binding = "CANDIDATE_VIDEOS"
bucket_name = "labatar-combo-candidates-local"
